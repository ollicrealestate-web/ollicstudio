name: Fetch material textures and 3D libraries
# Runs when a branch named fetch-assets/... is pushed: fetches CC0 textures (ambientCG) and the extra three.js
# libraries (npm), and commits them to the same branch. tools/fetch_assets.py records each source and licence.
on:
  push:
    branches: ["fetch-assets/**"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[fetched]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - run: python tools/fetch_assets.py vendor textures
      - name: Commit
        run: |
          git config user.name "Ollic Sketch"
          git config user.email "ollic-sketch@users.noreply.github.com"
          git add -A web/vendor web/assets/materials tools/out
          git commit -m "Fetched material textures and libraries [fetched]" || echo "nothing new"
          git push
